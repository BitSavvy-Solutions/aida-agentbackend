<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PDF Attachment Test - aida-agentbackend</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; background: #f5f5f7; }
  h1 { font-size: 20px; }
  textarea, input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; margin-bottom: 10px; }
  input[type=file] { margin-bottom: 10px; }
  button { padding: 8px 16px; font-size: 14px; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 6px; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  #output { white-space: pre-wrap; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px; min-height: 100px; margin-top: 10px; font-size: 14px; }
  #fileName { font-size: 13px; color: #555; margin-bottom: 10px; }
  .status { font-size: 12px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
  <h1>PDF Attachment Test (local backend)</h1>
  <p class="status">Sends requests to <code>http://localhost:8080/api/iverse_agent</code></p>

  <input type="text" id="userInput" placeholder="Ask something about the attached PDF..." value="Summarize this document." />
  <input type="file" id="pdfFile" accept="application/pdf" />
  <div id="fileName"></div>
  <button id="sendBtn">Send</button>

  <div id="output">Response will appear here...</div>

<script>
const fileInput = document.getElementById('pdfFile');
const fileNameEl = document.getElementById('fileName');
const sendBtn = document.getElementById('sendBtn');
const output = document.getElementById('output');
const userInputEl = document.getElementById('userInput');

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  fileNameEl.textContent = f ? `Selected: ${f.name} (${(f.size / 1024).toFixed(1)} KB)` : '';
});

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

sendBtn.addEventListener('click', async () => {
  sendBtn.disabled = true;
  output.textContent = '';
  try {
    const payload = {
      model: 'google/gemini-3.1-flash-lite-preview',
      user_input: userInputEl.value,
      message_history: [],
      pdf_attachments: []
    };

    const file = fileInput.files[0];
    if (file) {
      const dataUrl = await fileToDataUrl(file);
      payload.pdf_attachments = [dataUrl];
    }

    const resp = await fetch('http://localhost:8080/api/iverse_agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!resp.ok) {
      const errText = await resp.text();
      output.textContent = `HTTP ${resp.status}\n${errText}`;
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        try {
          const json = JSON.parse(line.slice(6));
          if (json.delta_content) {
            full += json.delta_content;
            output.textContent = full;
          }
          if (json.error) {
            output.textContent += `\n\n[ERROR] ${json.error}`;
          }
        } catch (e) { /* ignore partial JSON */ }
      }
    }
  } catch (err) {
    output.textContent = 'Request failed: ' + err.message;
  } finally {
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
